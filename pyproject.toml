[project]
name = "bodyops"
version = "0.11.2"
description = "BodyOps fitness tracking backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-ai>=0.2.0",
    "python-jose[cryptography]>=3.3.0",
    "gspread>=6.0.0",
    "google-auth>=2.30.0",
    "google-api-python-client>=2.130.0",
    "openai>=1.40.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
