<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodyOps — Interactive Prototype</title>
<link rel="stylesheet" href="app/tokens.css" />
<style>
  body { background: var(--paper-2); }
  .wrap { max-width: 1760px; margin: 0 auto; padding: 30px 28px 90px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
  .flow-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app/kit.jsx"></script>
<script type="text/babel" src="app/charts.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/mobile-shell.jsx"></script>
<script type="text/babel" src="app/m-home.jsx"></script>
<script type="text/babel" src="app/m-meals.jsx"></script>
<script type="text/babel" src="app/m-weight.jsx"></script>
<script type="text/babel" src="app/m-workout.jsx"></script>
<script type="text/babel" src="app/m-coach.jsx"></script>
<script type="text/babel" src="app/chat-logging.jsx"></script>
<script type="text/babel" src="app/m-progress.jsx"></script>
<script type="text/babel" src="app/m-misc.jsx"></script>
<script type="text/babel" src="app/desktop-shell.jsx"></script>
<script type="text/babel" src="app/d-dashboard.jsx"></script>
<script type="text/babel" src="app/d-screens-a.jsx"></script>
<script type="text/babel" src="app/d-screens-b.jsx"></script>
<script type="text/babel" src="app/d-onboarding.jsx"></script>
<script type="text/babel">
const { useState } = React;

const MOBILE_FLOWS = [
  ['onboarding', 'Onboarding'], ['home', 'Home'], ['meal-camera', 'Log a meal'],
  ['workout', 'Workout'], ['coach', 'Coach'], ['missions', 'Missions'],
  ['weight', 'Weight'], ['progress', 'Progress'], ['celebrate', 'Milestone'],
  ['empty-meals', 'Empty state'],
];
const DESK_FLOWS = [
  ['app', 'Dashboard app'], ['onboarding', 'Onboarding wizard'],
];

function SectionHead({ kicker, title, note }) {
  return (
    <div className="sec-head">
      <span className="eyebrow">{kicker}</span>
      <span style={{ fontSize: 20, fontWeight: 800, letterSpacing: -0.4 }}>{title}</span>
      <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)' }}>{note}</span>
    </div>
  );
}

function App() {
  const [mStart, setMStart] = useState('home');
  const [mKey, setMKey] = useState(0);
  const [dMode, setDMode] = useState('app');
  const [dKey, setDKey] = useState(0);

  const jumpM = (s) => { setMStart(s); setMKey(k => k + 1); };

  return (
    <div className="wrap">
      {/* page header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 8 }}>
        <div style={{ width: 40, height: 40, borderRadius: 11, background: 'var(--fill-ink)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="bolt" size={22} color="#fff" /></div>
        <div>
          <div style={{ fontSize: 26, fontWeight: 800, letterSpacing: -0.6 }}>BodyOps — Interactive Prototype</div>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink-3)', marginTop: 2 }}>Grayscale wireframes · clickable · mid-fidelity · engineering handoff</div>
        </div>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          <a href="BodyOps Screens.html" style={{ textDecoration: 'none' }}><Btn size="sm" variant="secondary" icon="list">All screens</Btn></a>
          <a href="BodyOps Foundations.html" style={{ textDecoration: 'none' }}><Btn size="sm" variant="secondary" icon="info">Foundations</Btn></a>
        </div>
      </div>
      <div style={{ height: 1, background: 'var(--line)', margin: '18px 0 28px' }} />

      {/* MOBILE */}
      <SectionHead kicker="01 · Mobile" title="iOS app" note="390 × 844 · tap the bottom tabs and cards to navigate" />
      <div className="flow-bar">
        <span style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--ink-3)', fontWeight: 600, alignSelf: 'center', marginRight: 4 }}>JUMP TO:</span>
        {MOBILE_FLOWS.map(([s, l]) => <Chip key={s} active={mStart === s} onClick={() => jumpM(s)}>{l}</Chip>)}
      </div>
      <div style={{ display: 'flex', gap: 40, alignItems: 'flex-start', flexWrap: 'wrap' }}>
        <PhoneFrame key={mKey} label={null}><MobileApp initial={mStart} /></PhoneFrame>
        <div style={{ flex: 1, minWidth: 240, maxWidth: 420, paddingTop: 8 }}>
          <Card pad={18}>
            <Eyebrow>How to use this</Eyebrow>
            <div style={{ fontSize: 13.5, lineHeight: 1.6, color: 'var(--ink-2)', marginTop: 10 }}>
              The phone runs the real app. Use the bottom tab bar to move between <b>Home, Meals, Workout, Progress</b> and <b>Coach</b>. Cards and buttons push detail screens; the back arrow returns.
            </div>
            <Divider style={{ margin: '14px 0' }} />
            <Eyebrow>Wired flows</Eyebrow>
            <Col gap={9} style={{ marginTop: 11 }}>
              {[['camera', 'Meal logging', 'Camera → AI analysis → review → confirm'],
                ['workout', 'Workout session', 'Plan → live set logging → summary'],
                ['weight', 'Weigh-in', 'Keypad entry → trend updates'],
                ['coach', 'Coach chat', 'Tap suggestions to converse'],
                ['bolt', 'Onboarding', '7-step goal setup']].map(([ic, t, s]) => (
                <Row key={t} gap={11} align="flex-start">
                  <div style={{ width: 32, height: 32, borderRadius: 'var(--r-sm)', background: 'var(--paper-2)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name={ic} size={16} color="var(--ink-2)" /></div>
                  <div><div style={{ fontSize: 13, fontWeight: 700 }}>{t}</div><div style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--ink-3)', marginTop: 1 }}>{s}</div></div>
                </Row>
              ))}
            </Col>
          </Card>
        </div>
      </div>

      <div style={{ height: 1, background: 'var(--line)', margin: '40px 0 28px' }} />

      {/* DESKTOP */}
      <SectionHead kicker="02 · Desktop" title="Web app" note="1280 × 820 · full sidebar navigation" />
      <div className="flow-bar">
        <span style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--ink-3)', fontWeight: 600, alignSelf: 'center', marginRight: 4 }}>VIEW:</span>
        {DESK_FLOWS.map(([s, l]) => <Chip key={s} active={dMode === s} onClick={() => { setDMode(s); setDKey(k => k + 1); }}>{l}</Chip>)}
      </div>
      <BrowserFrame key={dKey} label={null} url={dMode === 'onboarding' ? 'app.bodyops.io/welcome' : 'app.bodyops.io/dashboard'} width={1280} height={820}>
        {dMode === 'onboarding'
          ? <OnboardingDesktop D={window.DATA} onDone={() => { setDMode('app'); setDKey(k => k + 1); }} />
          : <DesktopApp initial="dashboard" />}
      </BrowserFrame>

      <div style={{ height: 60 }} />
      <div style={{ textAlign: 'center', fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>BodyOps · wireframe prototype · grayscale, no color committed yet</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
