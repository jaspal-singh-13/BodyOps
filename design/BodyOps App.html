<!DOCTYPE html>
<html lang="en" style="height:100%">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="BodyOps — AI-powered fat loss operating system. Log meals, track weight, follow your workout plan, and get coached toward your goal." />
<title>BodyOps</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d1c1a'/><path d='M18 5 8 18h7l-1 9 10-13h-7z' fill='white'/></svg>" />
<link rel="stylesheet" href="app/tokens.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; }
  #loading { position: fixed; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 999; }
  #loading .logo { width: 56px; height: 56px; background: var(--fill-ink); border-radius: 16px; display: flex; align-items: center; justify-content: center; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  #root { height: 100%; }
  /* Chat drawer */
  .chat-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--sh-pop); z-index: 100; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .25s cubic-bezier(.22,.8,.36,1); }
  .chat-drawer.open { transform: translateX(0); }
  .chat-overlay { position: fixed; inset: 0; background: rgba(29,28,26,0.3); z-index: 99; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .chat-overlay.open { opacity: 1; pointer-events: auto; }
  /* Chat FAB */
  .chat-fab { position: fixed; bottom: 26px; right: 26px; width: 56px; height: 56px; border-radius: 999px; background: var(--fill-ink); border: none; box-shadow: var(--sh-pop); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 98; transition: transform .15s; }
  .chat-fab:hover { transform: scale(1.06); }
  .chat-fab .badge { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 999px; background: var(--card); border: 2px solid var(--fill-ink); }
  /* Responsive — sidebar collapses at narrow widths */
  @media (max-width: 900px) {
    .chat-drawer { width: 100%; }
    .desk-sidebar { display: none !important; }
    .mob-topbar { display: flex !important; }
  }
  .mob-topbar { display: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="loading">
  <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M13 3 4 14h6l-1 7 9-11h-6z"/></svg></div>
  <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink-3)">Loading BodyOps…</span>
</div>
<div id="root" style="display:none"></div>
<script type="text/babel" src="app/kit.jsx"></script>
<script type="text/babel" src="app/charts.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/mobile-shell.jsx"></script>
<script type="text/babel" src="app/m-home.jsx"></script>
<script type="text/babel" src="app/m-meals.jsx"></script>
<script type="text/babel" src="app/m-weight.jsx"></script>
<script type="text/babel" src="app/m-workout.jsx"></script>
<script type="text/babel" src="app/m-coach.jsx"></script>
<script type="text/babel" src="app/m-progress.jsx"></script>
<script type="text/babel" src="app/m-misc.jsx"></script>
<script type="text/babel" src="app/desktop-shell.jsx"></script>
<script type="text/babel" src="app/d-dashboard.jsx"></script>
<script type="text/babel" src="app/d-screens-a.jsx"></script>
<script type="text/babel" src="app/d-screens-b.jsx"></script>
<script type="text/babel" src="app/d-onboarding.jsx"></script>
<script type="text/babel" src="app/chat-logging.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const WEBAPP_NAV = [
  { id: 'dashboard', label: 'Dashboard', icon: 'home' },
  { id: 'd-meals', label: 'Meals', icon: 'meal' },
  { id: 'd-weight', label: 'Weight', icon: 'weight' },
  { id: 'd-workouts', label: 'Workouts', icon: 'workout' },
  { id: 'd-progress', label: 'Progress', icon: 'progress' },
  { id: 'd-coach', label: 'Coach', icon: 'coach' },
];

function ChatDrawer({ open, onClose, D }) {
  return (
    <>
      <div className={`chat-overlay${open ? ' open' : ''}`} onClick={onClose} />
      <div className={`chat-drawer${open ? ' open' : ''}`}>
        <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', gap: 12, padding: '16px 18px', borderBottom: '1px solid var(--line)' }}>
          <CoachMark size={36} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: -0.3 }}>Chat with Coach</div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--ink-3)', marginTop: 1 }}>Log anything · ask anything</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginRight: 4 }}>
            <div style={{ width: 7, height: 7, borderRadius: 999, background: 'var(--ink)' }} />
            <span style={{ fontFamily: 'var(--mono)', fontSize: 9.5, color: 'var(--ink-3)', fontWeight: 600 }}>ONLINE</span>
          </div>
          <button onClick={onClose} style={{ width: 34, height: 34, borderRadius: 'var(--r-md)', border: '1px solid var(--line-2)', background: 'var(--card)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name="x" size={16} />
          </button>
        </div>
        {/* hint bar */}
        <div style={{ flexShrink: 0, padding: '8px 14px', background: 'var(--paper-2)', borderBottom: '1px solid var(--line)', display: 'flex', gap: 6, overflowX: 'auto' }} className="bo-scroll">
          {['Log a meal','Log my weight','Log workout','Coach advice'].map((h, i) => (
            <span key={i} style={{ flexShrink: 0, fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--ink-2)', background: 'var(--card)', padding: '5px 10px', borderRadius: 999, border: '1px solid var(--line-2)', whiteSpace: 'nowrap' }}>{h}</span>
          ))}
        </div>
        <ChatWithLogging D={D} compact={false} initialThread={D.coach.thread} />
      </div>
    </>
  );
}

function WebApp() {
  const D = window.DATA;
  const [screen, setScreen] = useState('dashboard');
  const [chatOpen, setChatOpen] = useState(false);
  const [onboarded, setOnboarded] = useState(true); // skip to app on load
  const Screens = window.DSCREENS || {};
  const Comp = Screens[screen] || (() => <div style={{padding:30,fontFamily:'var(--mono)'}}>Screen: {screen}</div>);
  const nav = { go: setScreen, tab: setScreen };

  if (!onboarded) {
    return (
      <div style={{ height: '100vh', overflow: 'hidden' }}>
        <OnboardingDesktop D={D} onDone={() => setOnboarded(true)} />
      </div>
    );
  }

  return (
    <div style={{ height: '100vh', display: 'flex', background: 'var(--paper)', overflow: 'hidden' }}>
      {/* Sidebar */}
      <div className="desk-sidebar" style={{ width: 234, flexShrink: 0, background: 'var(--card)', borderRight: '1px solid var(--line)', display: 'flex', flexDirection: 'column', height: '100%' }}>
        <div style={{ padding: '20px 18px 14px', display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 9, background: 'var(--fill-ink)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="bolt" size={18} color="#fff" /></div>
          <div style={{ fontSize: 17, fontWeight: 800, letterSpacing: -0.4 }}>BodyOps</div>
        </div>
        {/* log via chat CTA */}
        <div style={{ padding: '0 14px 10px' }}>
          <button onClick={() => setChatOpen(true)} style={{ width: '100%', height: 40, borderRadius: 'var(--r-md)', background: 'var(--fill-ink)', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, padding: '0 14px', color: '#fff', fontFamily: 'var(--sans)', fontSize: 13.5, fontWeight: 700, whiteSpace: 'nowrap' }}>
            <Icon name="coach" size={17} color="#fff" />Chat to log
          </button>
        </div>
        <div style={{ flex: 1, padding: '8px 12px', display: 'flex', flexDirection: 'column', gap: 2 }}>
          <Eyebrow style={{ padding: '8px 10px 6px' }}>Menu</Eyebrow>
          {WEBAPP_NAV.map(n => {
            const on = screen === n.id;
            return (
              <button key={n.id} onClick={() => setScreen(n.id)} style={{ display: 'flex', alignItems: 'center', gap: 11, height: 40, padding: '0 12px', borderRadius: 'var(--r-md)', border: 'none', cursor: 'pointer', background: on ? 'var(--paper-2)' : 'transparent', textAlign: 'left' }}>
                <Icon name={n.icon} size={18} color={on ? 'var(--ink)' : 'var(--ink-3)'} stroke={on ? 2 : 1.6} />
                <span style={{ fontSize: 13.5, fontWeight: on ? 700 : 500, color: on ? 'var(--ink)' : 'var(--ink-2)' }}>{n.label}</span>
                {n.id === 'd-coach' && <span style={{ marginLeft: 'auto', width: 7, height: 7, borderRadius: 999, background: 'var(--ink)' }} />}
              </button>
            );
          })}
        </div>
        <div style={{ padding: 12, borderTop: '1px solid var(--line)' }}>
          <button onClick={() => setScreen('d-settings')} style={{ display: 'flex', alignItems: 'center', gap: 11, height: 40, padding: '0 12px', width: '100%', borderRadius: 'var(--r-md)', border: 'none', cursor: 'pointer', background: screen === 'd-settings' ? 'var(--paper-2)' : 'transparent' }}>
            <Icon name="gear" size={18} color="var(--ink-3)" />
            <span style={{ fontSize: 13.5, color: 'var(--ink-2)', fontWeight: 500 }}>Settings</span>
          </button>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 8px 2px' }}>
            <Avatar initials={D.user.initials} size={34} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{D.user.name}</div>
              <div style={{ fontFamily: 'var(--mono)', fontSize: 9.5, color: 'var(--ink-3)' }}>Day {D.user.dayN} · {D.goal.current} kg</div>
            </div>
          </div>
        </div>
      </div>

      {/* Mobile topbar (narrow screens) */}
      <div className="mob-topbar" style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 52, background: 'var(--card)', borderBottom: '1px solid var(--line)', alignItems: 'center', padding: '0 16px', gap: 12, zIndex: 30 }}>
        <div style={{ width: 28, height: 28, borderRadius: 8, background: 'var(--fill-ink)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="bolt" size={16} color="#fff" /></div>
        <div style={{ fontSize: 15, fontWeight: 800, flex: 1 }}>BodyOps</div>
        <button onClick={() => setChatOpen(true)} style={{ width: 36, height: 36, borderRadius: 'var(--r-md)', background: 'var(--fill-ink)', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="coach" size={18} color="#fff" /></button>
      </div>

      {/* Main content */}
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
        <Comp nav={nav} D={D} />
      </div>

      {/* Chat overlay + drawer */}
      <ChatDrawer open={chatOpen} onClose={() => setChatOpen(false)} D={D} />

      {/* FAB — always visible unless chat is open */}
      {!chatOpen && (
        <button className="chat-fab" onClick={() => setChatOpen(true)} title="Log via chat">
          <Icon name="coach" size={26} color="#fff" />
          <div className="badge" />
        </button>
      )}
    </div>
  );
}

// Hide loading spinner once React mounts
function AppWithReady() {
  useEffect(() => {
    const el = document.getElementById('loading');
    const root = document.getElementById('root');
    if (el) el.style.display = 'none';
    if (root) root.style.display = '';
  }, []);
  return <WebApp />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWithReady />);
</script>
</body>
</html>
